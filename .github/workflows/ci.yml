# 审计修复（10）：CI——Windows 全量验证（本产品为 Windows 专用：win 沙箱/桌面/OCR）
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (shared → sandbox-rs native → agent)
        run: npm run build

      - name: TypeScript check (web / desktop)
        run: |
          npx tsc -p packages/web/tsconfig.json --noEmit
          npx tsc -p packages/desktop/tsconfig.json --noEmit

      - name: Rust check (sandbox-rs)
        run: cargo check
        working-directory: packages/sandbox-rs

      - name: Lint
        run: npm run lint

      - name: Test (full suite via test-runner)
        run: npm test