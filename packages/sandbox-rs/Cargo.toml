[package]
name = "infu-sandbox"
version = "0.1.0"
edition = "2021"
description = "InFu Windows 硬沙箱（restricted tokens + job objects）"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi8", "async", "tokio_rt", "serde-json"] }
napi-derive = "3"
tokio = { version = "1", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
# Win32_Security_Isolation：AppContainer 档案/低盒令牌（M6 断网强制层）
# Win32_NetworkManagement_NetManagement：NetUserAdd/Del（沙箱专用账号）
# Win32_Security_Cryptography：DPAPI（账号密码密文存储）+ BCryptGenRandom
# Win32_Security_Authorization：SetEntriesInAclW（工作区 ACL 授权）
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authentication_Identity",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Security_Isolation",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_NetworkManagement_NetManagement",
] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
