# 审计修复（10）：CI——Windows 全量验证（本产品为 Windows 专用：win 沙箱/桌面/OCR）
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (shared → sandbox-rs native → agent)
        run: npm run build

      - name: Build web production bundle
        run: npm run build -w @infu/web

      - name: Install Chromium for production E2E
        run: npx playwright-core install chromium

      - name: Restore visual baseline cache
        uses: actions/cache@v4
        with:
          path: packages/web/artifacts/visual-reference
          # Increment this deliberately when an approved visual redesign replaces
          # the reference set. Routine UI regressions still use the 0.1% gate below.
          key: infu-visual-baseline-v1.1.0-${{ github.ref_name }}

      - name: Start web preview for visual baseline
        shell: pwsh
        run: |
          $chrome = Get-ChildItem "$env:USERPROFILE\AppData\Local\ms-playwright" -Recurse -Filter chrome.exe | Select-Object -First 1
          if (-not $chrome) { throw "Chromium executable not found after install" }
          "INFU_CHROMIUM_PATH=$($chrome.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $previewLog = Join-Path $env:RUNNER_TEMP "infu-web-preview.log"
          $previewCommand = "npm run preview -w @infu/web -- --host 127.0.0.1 --port 5174 > `"$previewLog`" 2>&1"
          Start-Process -FilePath "cmd.exe" -ArgumentList "/d", "/s", "/c", $previewCommand -WindowStyle Hidden
          $ready = $false
          for ($i = 0; $i -lt 30; $i++) {
            try { Invoke-WebRequest http://127.0.0.1:5174 -UseBasicParsing -TimeoutSec 2 | Out-Null; $ready = $true; break } catch { Start-Sleep -Seconds 1 }
          }
          if (-not $ready) {
            if (Test-Path $previewLog) { Get-Content $previewLog }
            throw "Web preview did not become ready on port 5174"
          }

      - name: Capture visual baselines (light/dark, desktop/narrow)
        run: npm run visual:baseline -w @infu/web
        env:
          INFU_PREVIEW_URL: http://127.0.0.1:5174/
          INFU_VISUAL_OUTPUT_DIR: artifacts/visual-current

      - name: Compare visual baseline pixels
        shell: pwsh
        run: |
          $reference = "packages/web/artifacts/visual-reference"
          if (-not (Test-Path $reference)) {
            New-Item -ItemType Directory -Force $reference | Out-Null
            Copy-Item packages/web/artifacts/visual-current/*.png $reference -Force
            Write-Host "No cached baseline yet; current screenshots become the reference for this branch."
          } else {
            npm run visual:baseline -w @infu/web
          }
        env:
          INFU_PREVIEW_URL: http://127.0.0.1:5174/
          INFU_VISUAL_OUTPUT_DIR: artifacts/visual-compare
          INFU_VISUAL_REFERENCE_DIR: artifacts/visual-reference
          INFU_VISUAL_THRESHOLD: "0.001"

      - name: Upload visual baselines
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infu-visual-baseline
          path: packages/web/artifacts/
          if-no-files-found: warn

      - name: TypeScript check (web / desktop)
        run: |
          npx tsc -p packages/web/tsconfig.json --noEmit
          npx tsc -p packages/desktop/tsconfig.json --noEmit

      - name: Build desktop application
        run: npm run build -w @infu/desktop

      - name: Verify bundled skills
        run: node scripts/skills-check.mjs

      - name: Rust check (sandbox-rs)
        run: cargo check
        working-directory: packages/sandbox-rs

      - name: Lint
        run: npm run lint -- --format stylish

      - name: Test (full suite via test-runner)
        run: npm test
